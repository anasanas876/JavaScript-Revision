<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Color Palette</h1>

        <p class="description">
            Choose a color or generate a random color.
        </p>

        <div class="selected-color">
            <p>Selected Color:</p>
            <h2 id="color-name">None</h2>
        </div>

        <div class="colors-container">

            <button class="color-btn" data-color="crimson">
                Crimson
            </button>

            <button class="color-btn" data-color="royalblue">
                Royal Blue
            </button>

            <button class="color-btn" data-color="seagreen">
                Sea Green
            </button>

            <button class="color-btn" data-color="orange">
                Orange
            </button>

            <button class="color-btn" data-color="purple">
                Purple
            </button>

            <button class="color-btn" data-color="teal">
                Teal
            </button>

        </div>

        <button class="random-btn">
            Random Color
        </button>

        <div class="message">
            <p id="message-text">
                Choose a color to change the background.
            </p>
        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
